# Override for DATASTORE=scylla. Merged after configs/gitstore.toml.

[api.datastore]
backend = "scylla"

[api.datastore.scylla]
hosts = "scylla:9042"
keyspace = "gitstore"

[api.watch.journal]
retention = "168h"
bookmark_interval = "30s"

[api.watch.journal.cdc]
confidence_window = "500ms"

[api.watch.journal.read]
batch_size = 256
max_replay_events = 100000

[api.watch.journal.subscriber]
buffer = 64
backpressure = "30s"

[api.watch.journal.poll]
min = "100ms"
max = "2s"

[api.watch.journal.materializer]
lease_ttl = "30s"
lease_renew_interval = "10s"
max_lag = "60s"
