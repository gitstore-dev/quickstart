services:
  credential-bootstrap:
    profiles: [local]
    image: gitstore-quickstart-bootstrap:${GITSTORE_TAG:-latest}
    build:
      context: ./docker/bootstrap
      args:
        GITSTORE_TAG: ${GITSTORE_TAG:-latest}
    command:
      - /bin/sh
      - -ec
      - |
        rm -f /run/controller-bootstrap/serviceaccount.env
        controller_key_dir=/run/controller-secrets/gitstore-controller-manager-signing-key
        migration_dir="$$controller_key_dir.migration"
        if [ -f "$$controller_key_dir" ]; then
          test ! -e "$$migration_dir"
          mkdir "$$migration_dir"
          mv "$$controller_key_dir" "$$migration_dir/privateKey"
        fi
        if [ -d "$$migration_dir" ]; then
          test ! -e "$$controller_key_dir"
          mv "$$migration_dir" "$$controller_key_dir"
        fi
        /app/api gitctl generate-signing-key --private-key-path /run/api-issuer/serviceaccount-signing-key
        chown 65532:65532 /run/api-issuer/serviceaccount-signing-key
        mkdir -p "$$controller_key_dir"
        /app/api gitctl generate-signing-key \
          --private-key-path "$$controller_key_dir/privateKey" \
          --record-output-path /run/controller-secrets/gitstore-controller-manager-signing-key.json \
          --key-id controller-key
    volumes:
      - api-serviceaccount-issuer-key:/run/api-issuer
      - controller-serviceaccount-secrets:/run/controller-secrets
      - controller-serviceaccount-identity:/run/controller-bootstrap
    networks: [gitstore]

  serviceaccount-enrollment:
    profiles: [local]
    image: ghcr.io/gitstore-dev/api:${GITSTORE_TAG:-latest}
    # Only enrollment needs to read the root-owned controller key and write its identity.
    user: "0:0"
    environment:
      GITSTORE_BOOTSTRAP_ADMIN_USERNAME: ${GITSTORE_BOOTSTRAP_ADMIN_USERNAME:-admin}
      GITSTORE_BOOTSTRAP_ADMIN_PASSWORD: ${GITSTORE_BOOTSTRAP_ADMIN_PASSWORD:-admin123}
    command:
      - /app/api
      - gitctl
      - enroll-serviceaccount
      - --api-url
      - http://api:4000/admin/graphql
      - --name
      - gitstore-controller-manager
      - --key-id
      - controller-key
      - --replace-existing-key
      - --private-key-path
      - /run/controller-secrets/gitstore-controller-manager-signing-key/privateKey
      - --identity-output-path
      - /run/controller-bootstrap/serviceaccount.env
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - controller-serviceaccount-secrets:/run/controller-secrets
      - controller-serviceaccount-identity:/run/controller-bootstrap
    networks: [gitstore]

  api:
    command: >-
      /app/api ${API_CONFIG_ARGS:---config-file /etc/gitstore/gitstore.toml}
      --serviceaccount-signing-key-file /run/secrets/serviceaccount-signing-key
    volumes:
      - api-serviceaccount-issuer-key:/run/secrets:ro
    depends_on:
      credential-bootstrap:
        condition: service_completed_successfully

  controller-manager:
    environment:
      - CONFIG_FILES
    command:
      - /bin/sh
      - -ec
      - |
        : "$${CONFIG_FILES:=/etc/gitstore/gitstore.toml}"
        serviceaccount_uid="$$(sed -n 's/^GITSTORE_CONTROLLER__SERVICEACCOUNT__UID=//p' /run/controller-bootstrap/serviceaccount.env)"
        test -n "$$serviceaccount_uid"
        export GITSTORE_CONTROLLER__SERVICEACCOUNT__UID="$$serviceaccount_uid"
        set --
        for f in $$CONFIG_FILES; do set -- "$$@" --config-file "$$f"; done
        exec /app/controller-manager "$$@"
    volumes:
      - controller-serviceaccount-identity:/run/controller-bootstrap:ro
      - controller-serviceaccount-secrets:/run/secrets:ro
    depends_on:
      serviceaccount-enrollment:
        condition: service_completed_successfully

volumes:
  api-serviceaccount-issuer-key:
  controller-serviceaccount-secrets:
  controller-serviceaccount-identity:
