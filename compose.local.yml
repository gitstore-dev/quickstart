services:
  credential-bootstrap:
    profiles: [local]
    image: ghcr.io/gitstore-dev/api:${GITSTORE_TAG:-latest}
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /run/controller-secrets/gitstore-controller-manager-signing-key
        rm -f /run/controller-bootstrap/serviceaccount.env
        /app/gitctl generate-signing-key --private-key-path /run/api-issuer/serviceaccount-signing-key
        /app/gitctl generate-signing-key --private-key-path /run/controller-secrets/gitstore-controller-manager-signing-key/privateKey
    volumes:
      - api-serviceaccount-issuer-key:/run/api-issuer
      - controller-serviceaccount-secrets:/run/controller-secrets
      - controller-serviceaccount-identity:/run/controller-bootstrap
    networks: [gitstore]

  serviceaccount-enrollment:
    profiles: [local]
    image: ghcr.io/gitstore-dev/api:${GITSTORE_TAG:-latest}
    environment:
      ADMIN_USERNAME: ${GITSTORE_BOOTSTRAP_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${GITSTORE_BOOTSTRAP_ADMIN_PASSWORD:-admin123}
    command:
      - /bin/sh
      - -ec
      - |
        # gitctl enroll-serviceaccount's --admin-username/--admin-password path
        # always fails with "bootstrap authentication failed" on this image - log
        # in via GraphQL directly instead and pass the token with --admin-token.
        payload='{"query":"mutation { login(input:{username:\"'"$$ADMIN_USERNAME"'\",password:\"'"$$ADMIN_PASSWORD"'\"}) { token { accessToken } } }"}'
        token="$$(wget -q -O- --header='Content-Type: application/json' --post-data="$$payload" http://api:4000/graphql | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p')"
        test -n "$$token"
        exec /app/gitctl enroll-serviceaccount --api-url http://api:4000/graphql --admin-token "$$token" \
          --namespace controllers --name gitstore-controller-manager --key-id controller-key \
          --replace-existing-key --private-key-path /run/controller-secrets/gitstore-controller-manager-signing-key/privateKey \
          --identity-output-path /run/controller-bootstrap/serviceaccount.env
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - controller-serviceaccount-secrets:/run/controller-secrets
      - controller-serviceaccount-identity:/run/controller-bootstrap
    networks: [gitstore]

  api:
    environment:
      - CONFIG_FILES
    command:
      - /bin/sh
      - -ec
      - |
        : "$${CONFIG_FILES:=/etc/gitstore/gitstore.toml}"
        if [ -f /run/secrets/serviceaccount-signing-key ]; then
          export GITSTORE_AUTH__SERVICEACCOUNT__SIGNING_KEY="$$(cat /run/secrets/serviceaccount-signing-key)"
        fi
        set --
        for f in $$CONFIG_FILES; do set -- "$$@" --config-file "$$f"; done
        exec /app/api "$$@"
    volumes:
      - api-serviceaccount-issuer-key:/run/secrets:ro
    depends_on:
      credential-bootstrap:
        condition: service_completed_successfully

  controller-manager:
    environment:
      - CONFIG_FILES
    command:
      - /bin/sh
      - -ec
      - |
        : "$${CONFIG_FILES:=/etc/gitstore/gitstore.toml}"
        serviceaccount_uid="$$(sed -n 's/^GITSTORE_CONTROLLER__SERVICEACCOUNT__UID=//p' /run/controller-bootstrap/serviceaccount.env)"
        test -n "$$serviceaccount_uid"
        export GITSTORE_CONTROLLER__SERVICEACCOUNT__UID="$$serviceaccount_uid"
        set --
        for f in $$CONFIG_FILES; do set -- "$$@" --config-file "$$f"; done
        exec /app/controller-manager "$$@"
    volumes:
      - controller-serviceaccount-identity:/run/controller-bootstrap:ro
      - controller-serviceaccount-secrets:/run/secrets:ro
    depends_on:
      serviceaccount-enrollment:
        condition: service_completed_successfully

volumes:
  api-serviceaccount-issuer-key:
  controller-serviceaccount-secrets:
  controller-serviceaccount-identity:
